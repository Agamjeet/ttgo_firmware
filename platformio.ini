; LILYGO T-Display-S3 (standard 1.9", 170x320 ST7789, 8-bit parallel).
; Not for the AMOLED, Long, or Pro variants.
; Flash is 16MB. The board default partition table (default_16MB.csv)
; has two app slots (app0/app1, 0x640000 bytes each). OTA writes only
; firmware.bin into the inactive slot. The bootloader has app rollback enabled.

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = lovyan03/LovyanGFX@1.2.33
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
